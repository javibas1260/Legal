<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cuadrilla Sky · Panel de reservas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecera compacta">
    <div class="interior">
      <h1 class="marca" data-marca aria-label="Cuadrilla Sky"><span class="marca-principal">cuadrilla</span><span class="marca-secundaria">sky</span></h1>
      <span class="subtitulo">Panel de reservas</span>
    </div>
  </header>

  <!-- Acceso -->
  <main class="contenedor" id="vista-login" style="margin-top:3rem">
    <form class="tarjeta" id="form-login">
      <h2>Acceso del equipo</h2>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div id="error-login" class="aviso error oculto" role="alert"></div>
      <button type="submit" class="bloque">Entrar</button>
    </form>
  </main>

  <!-- Panel -->
  <main class="contenedor ancho oculto" id="vista-panel">
    <div class="barra-sup">
      <h2 style="margin:0">Reservas</h2>
      <div class="acciones" style="margin:0">
        <button type="button" id="nueva">+ Nueva reserva</button>
        <button type="button" class="secundario" id="salir">Salir</button>
      </div>
    </div>

    <section class="tarjeta" style="margin-top:1rem">
      <div class="barra">
        <div class="campo ajustado">
          <label>&nbsp;</label>
          <button type="button" class="secundario icono" id="anterior" aria-label="Día anterior">◀</button>
        </div>
        <div class="campo">
          <label for="f-fecha">Día</label>
          <input type="date" id="f-fecha">
        </div>
        <div class="campo ajustado">
          <label>&nbsp;</label>
          <button type="button" class="secundario icono" id="siguiente" aria-label="Día siguiente">▶</button>
        </div>
        <div class="campo ajustado">
          <label>&nbsp;</label>
          <button type="button" class="secundario" id="hoy">Hoy</button>
        </div>
        <div class="campo">
          <label for="f-estado">Estado</label>
          <select id="f-estado">
            <option value="">Todos</option>
            <option value="confirmada">Confirmadas</option>
            <option value="cancelada">Canceladas</option>
            <option value="completada">Completadas</option>
            <option value="no_presentado">No presentados</option>
          </select>
        </div>
        <div class="campo">
          <label for="f-buscar">Buscar</label>
          <input id="f-buscar" type="search" placeholder="Nombre, teléfono, código…">
        </div>
      </div>
      <p class="nota" id="titulo-dia"></p>
    </section>

    <section class="tarjeta">
      <div class="kpis" id="kpis"></div>
      <h3>Ocupación por franja · <span id="leyenda"></span></h3>
      <div class="ocupacion" id="ocupacion"></div>
    </section>

    <section class="tarjeta">
      <div class="tabla-wrap">
        <table>
          <thead><tr><th>Hora</th><th>Pax</th><th>Cliente</th><th>Comentarios</th><th>Código</th><th>Estado</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
      <div id="error-panel" class="aviso error oculto" role="alert"></div>
    </section>
  </main>

  <!-- Nueva reserva (teléfono / presencial) -->
  <dialog id="dialogo">
    <form id="form-nueva" method="dialog">
      <h2>Nueva reserva</h2>
      <div class="fila">
        <div class="campo"><label for="n-fecha">Fecha</label><input type="date" id="n-fecha" required></div>
        <div class="campo"><label for="n-personas">Personas</label><select id="n-personas"></select></div>
      </div>
      <div class="campo"><label for="n-hora">Hora</label><select id="n-hora" required></select></div>
      <div class="campo"><label for="n-nombre">Nombre</label><input id="n-nombre" required maxlength="80"></div>
      <div class="fila">
        <div class="campo"><label for="n-telefono">Teléfono</label><input id="n-telefono" type="tel" required maxlength="20"></div>
        <div class="campo"><label for="n-email">Email <span class="nota">(opcional)</span></label><input id="n-email" type="email" maxlength="120"></div>
      </div>
      <div class="campo"><label for="n-comentarios">Comentarios</label><textarea id="n-comentarios" maxlength="500"></textarea></div>
      <div class="campo"><label class="check"><input type="checkbox" id="n-enviar" checked><span>Enviar email de confirmación al cliente</span></label></div>
      <div id="error-nueva" class="aviso error oculto" role="alert"></div>
      <div class="acciones">
        <button type="button" class="secundario" id="cerrar">Cerrar</button>
        <button type="submit" id="guardar">Guardar reserva</button>
      </div>
    </form>
  </dialog>

  <script src="js/comun.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
