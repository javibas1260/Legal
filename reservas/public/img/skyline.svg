<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 240" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <!-- Ventanas: unas encendidas, otras apagadas -->
    <pattern id="ventanas" width="12" height="11" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="3" height="4" fill="#f6d58e" opacity=".55"/>
      <rect x="7" y="2" width="3" height="4" fill="#9fc1dc" opacity=".12"/>
    </pattern>
    <pattern id="ventanas2" width="16" height="13" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="3" height="4" fill="#9fc1dc" opacity=".14"/>
      <rect x="10" y="3" width="3" height="4" fill="#f6d58e" opacity=".4"/>
    </pattern>
    <radialGradient id="brillo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ciudad que se extiende a los lados -->
  <g fill="#132840">
    <rect x="0" y="178" width="90" height="62"/><rect x="85" y="160" width="50" height="80"/><rect x="140" y="186" width="110" height="54"/>
    <rect x="245" y="150" width="45" height="90"/><rect x="295" y="175" width="80" height="65"/><rect x="380" y="190" width="60" height="50"/>
    <rect x="445" y="165" width="50" height="75"/><rect x="500" y="182" width="100" height="58"/>
    <rect x="1650" y="176" width="70" height="64"/><rect x="1715" y="158" width="48" height="82"/><rect x="1760" y="184" width="45" height="56"/><rect x="1800" y="172" width="70" height="68"/><rect x="1865" y="152" width="45" height="88"/><rect x="1915" y="185" width="95" height="55"/>
    <rect x="2005" y="162" width="55" height="78"/><rect x="2065" y="180" width="80" height="60"/><rect x="2140" y="158" width="40" height="82"/>
    <rect x="2185" y="188" width="110" height="52"/><rect x="2290" y="170" width="110" height="70"/>
  </g>
  <g fill="#132840" opacity=".9">
    <rect x="245" y="150" width="45" height="90" fill="url(#ventanas2)"/><rect x="1865" y="152" width="45" height="88" fill="url(#ventanas2)"/>
  </g>
  <rect x="0" y="216" width="2400" height="24" fill="#08111d"/>
  <g transform="translate(450 0)">
  <!-- Ciudad al fondo -->
  <g fill="#132840">
    <rect x="0" y="170" width="70" height="70"/><rect x="60" y="150" width="45" height="90"/>
    <rect x="110" y="182" width="80" height="58"/><rect x="185" y="160" width="40" height="80"/>
    <rect x="230" y="190" width="60" height="50"/><rect x="395" y="175" width="45" height="65"/>
    <rect x="540" y="185" width="50" height="55"/><rect x="805" y="178" width="42" height="62"/>
    <rect x="960" y="165" width="55" height="75"/><rect x="1010" y="185" width="70" height="55"/>
    <rect x="1075" y="155" width="40" height="85"/><rect x="1110" y="180" width="90" height="60"/>
  </g>

  <!-- Las torres -->
  <g fill="#0b1726">
    <path d="M300 240V22h68v218zM314 32v28h40V32z" fill-rule="evenodd"/>
    <path d="M452 240V70q34-40 68 0v170z"/>
    <path d="M600 240V34l64-22v228z"/>
    <path d="M722 240V48q34-22 68 0v192z"/>
    <path d="M868 240V92h66v148z"/>
  </g>
  <g>
    <path d="M300 240V62h68v178z" fill="url(#ventanas)"/>
    <path d="M452 240V80h68v160z" fill="url(#ventanas2)"/>
    <path d="M600 240V40l64-22v222z" fill="url(#ventanas)"/>
    <path d="M722 240V56h68v184z" fill="url(#ventanas2)"/>
    <path d="M868 240V110h66v130z" fill="url(#ventanas)"/>
  </g>

  <!-- Cuadrilla Sky: la planta iluminada en lo alto -->
  <ellipse cx="901" cy="98" rx="80" ry="34" fill="url(#brillo)"/>
  <rect x="868" y="92" width="66" height="12" fill="#ffd27a"/>
  <rect x="868" y="104" width="66" height="2" fill="#0b1726"/>

  <!-- Primer plano -->
  <path d="M0 240v-28h120v-10h90v14h150v-8h170v12h210v-6h160v10h140v-12h160v28z" fill="#08111d"/>
  </g>
</svg>
